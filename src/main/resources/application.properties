spring.application.name=ticket

# ─── Servidor ────────────────────────────────────────────────────────────────
# Todas las rutas REST cuelgan de /api (ej: http://localhost:8080/api/tickets)
server.port=8080
server.servlet.context-path=/api

# ─── Base de datos MySQL ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/db_serpost_tickets?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ─── Serialización JSON (Jackson 3) ──────────────────────────────────────────
# En Jackson 3 las fechas ya se serializan como ISO-8601 por defecto. Se mantienen
# los valores nulos para respetar los campos "| null" del contrato del frontend.

# ─── Datos semilla ───────────────────────────────────────────────────────────
# Activa la carga de catálogos y usuarios de prueba al iniciar (ver DataSeeder).
app.seed.enabled=true

# ─── Seguridad JWT ───────────────────────────────────────────────────────────
# Clave secreta para firmar los tokens (HS256). Debe tener al menos 32 caracteres.
# En producción, externalícela como variable de entorno y nunca la versione.
app.jwt.secret=serpost-mesa-de-ayuda-clave-secreta-jwt-cambiar-en-produccion-2026
# Vigencia del token en milisegundos (8 horas).
app.jwt.expiration-ms=28800000

# ─── Adjuntos (evidencias) ───────────────────────────────────────────────────
# Directorio donde se almacenan los archivos subidos.
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# ─── Correo (notificaciones SMTP) ────────────────────────────────────────────
# Deshabilitado por defecto: las notificaciones solo se registran. Para activar el
# envío real, pon app.mail.enabled=true y configura un servidor SMTP (ej. Gmail con
# App Password o Mailtrap).
app.mail.enabled=false
app.mail.from=no-reply@serpost.pe
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
